<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾页 · 私有收藏</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">拾</div><div><h1>随手找回，好好读完。</h1><p>你的私有收藏镜像 · 只读</p></div><button id="logout" hidden>退出</button></header><p id="status" role="status"></p><form id="login"><label>只读访问凭据<input id="token" type="password" autocomplete="off" required></label><button>登录私有收藏</button><p>使用部署时生成的只读凭据，不填写 Cloudflare 管理密钥。凭据不会写进网址。</p></form><section id="library" hidden><p id="published"></p><div class="filters"><label>搜索<input id="query" type="search" placeholder="标题、网址或分类…"></label><label>范围<select id="scope"><option value="all">全部收藏</option><option value="pinned">置顶收藏</option><option value="reading">待看</option></select></label><label>分类<select id="category"><option value="">全部分类</option></select></label><button id="reload">重新载入</button></div><p id="count"></p><div id="results"></div><nav><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></nav><p>内容来自电脑最后一次发布，修改与删除需回电脑后重新发布。此页面不保存离线副本，不提供 AI。</p></section></main><script src="/app.js" defer></script></body></html>
